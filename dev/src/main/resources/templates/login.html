<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Star Depiller</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center">
<div class="w-full max-w-md px-4">
    <div class="mb-8 text-center">
        <h1 class="text-3xl font-bold text-white tracking-tight">
            Star <span class="text-emerald-400">Depiller</span>
        </h1>
        <p class="mt-2 text-slate-300 text-sm">
            Acesse o painel para gerenciar clientes, tratamentos e sessões.
        </p>
    </div>

    <div class="bg-slate-900/70 border border-slate-700/60 shadow-xl shadow-black/40 rounded-2xl p-8 backdrop-blur">
        <h2 class="text-xl font-semibold text-white mb-6 text-center">
            Entrar no sistema
        </h2>

        <div th:if="${param.error}" class="mb-4 rounded-lg bg-red-500/10 border border-red-500/40 px-4 py-3 text-sm text-red-200">
            Usuário ou senha inválidos. Tente novamente.
        </div>
        <div th:if="${param.logout}" class="mb-4 rounded-lg bg-emerald-500/10 border border-emerald-500/40 px-4 py-3 text-sm text-emerald-200">
            Logout realizado com sucesso.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-200 mb-1">
                    Email
                </label>
                <input id="username" name="username" type="email" required
                       class="block w-full rounded-lg border border-slate-600 bg-slate-900/80 px-3 py-2 text-slate-100 placeholder-slate-500 text-sm
                              focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-200 mb-1">
                    Senha
                </label>
                <input id="password" name="password" type="password" required
                       class="block w-full rounded-lg border border-slate-600 bg-slate-900/80 px-3 py-2 text-slate-100 placeholder-slate-500 text-sm
                              focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400">
            </div>
            <button type="submit"
                    class="w-full inline-flex justify-center rounded-lg bg-emerald-500 px-4 py-2.5 text-sm font-semibold text-slate-900
                           shadow-lg shadow-emerald-500/40 hover:bg-emerald-400 transition-colors">
                Entrar
            </button>
        </form>
    </div>

    <p class="mt-6 text-center text-xs text-slate-400">
        Sistema interno da clínica de depilação a laser <span class="text-emerald-300 font-medium">Star Depiller</span>.
    </p>
</div>
</body>
</html>
