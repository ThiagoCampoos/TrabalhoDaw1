<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Clientes</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  </head>
  <body>
    <h1>Clientes</h1>

    <form
      hx-get="/clientes"
      hx-target="#tabela-clientes"
      hx-push-url="true"
      hx-trigger="keyup changed delay:400ms from:#busca"
    >
      <input
        type="text"
        id="busca"
        name="busca"
        th:value="${busca}"
        placeholder="Buscar por nome..."
      />
      <noscript>
        <button type="submit">Buscar</button>
      </noscript>
    </form>

    <div
      id="tabela-clientes"
      hx-get="/clientes"
      hx-push-url="true"
    >
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="4">Nenhum cliente cadastrado.</td>
          </tr>
          <tr th:each="c : ${clientes}" th:unless="${#lists.isEmpty(clientes)}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nome}"></td>
            <td th:text="${c.email}"></td>
            <td>
              <a th:href="@{|/clientes/${c.id}/ficha|}">Ficha</a>
              <a th:href="@{|/clientes/${c.id}/tratamentos|}">Tratamentos</a>
              <a th:href="@{|/clientes/${c.id}/acompanhamento|}">Acompanhamento</a>
              <form th:action="@{|/clientes/${c.id}/excluir|}" method="post" style="display: inline">
                <button type="submit">Excluir</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="paginacao">
        <button
          th:if="${!pagina.first}"
          hx-get="/clientes"
          hx-target="#tabela-clientes"
          hx-push-url="true"
          th:attr="hx-vals=${'{' + '&quot;page&quot;:' + (${pagina.number} - 1) + ',&quot;busca&quot;:&quot;' + (busca ?: '') + '&quot;}' }"
        >
          Anterior
        </button>

        <span th:text="${pagina.number + 1} + ' / ' + ${pagina.totalPages}"
          >1 / 1</span
        >

        <button
          th:if="${!pagina.last}"
          hx-get="/clientes"
          hx-target="#tabela-clientes"
          hx-push-url="true"
          th:attr="hx-vals=${'{' + '&quot;page&quot;:' + (${pagina.number} + 1) + ',&quot;busca&quot;:&quot;' + (busca ?: '') + '&quot;}' }"
        >
          Próxima
        </button>
      </div>
    </div>
  </body>
</html>
