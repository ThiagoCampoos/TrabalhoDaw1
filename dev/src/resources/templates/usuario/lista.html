<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuários</title>
</head>
<body>
<h1>Usuários</h1>

<table border="1" cellpadding="4" cellspacing="0">
    <thead>
    <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Tipo</th>
        <th>Ativo</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${usuarios}">
        <td th:text="${u.nome}">Nome</td>
        <td th:text="${u.email}">email@example.com</td>
        <td th:text="${u.tipo}">ADMIN</td>
        <td th:text="${u.ativo}">true</td>
        <td>
            <!-- Para simplificar, só exclusão por enquanto -->
            <form th:action="@{|/usuarios/${u.id}/excluir|}" method="post" style="display:inline">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(usuarios)}">
        <td colspan="5">Nenhum usuário cadastrado.</td>
    </tr>
    </tbody>
</table>

<h2>Novo usuário</h2>
<form th:action="@{/usuarios}" th:object="${usuarioForm}" method="post">
    <div>
        <label for="nome">Nome:</label>
        <input id="nome" th:field="*{nome}" required>
    </div>
    <div>
        <label for="email">Email:</label>
        <input id="email" th:field="*{email}" type="email" required>
    </div>
    <div>
        <label for="senha">Senha:</label>
        <input id="senha" th:field="*{senha}" type="password" required>
    </div>
    <div>
        <label for="tipo">Tipo:</label>
        <select id="tipo" th:field="*{tipo}">
            <option value="ADMIN">ADMIN</option>
            <option value="FUNCIONARIO">FUNCIONARIO</option>
        </select>
    </div>
    <div>
        <label>
            <input type="checkbox" th:field="*{ativo}">
            Ativo
        </label>
    </div>
    <div>
        <button type="submit">Salvar</button>
        <a th:href="@{/clientes}">Voltar</a>
    </div>
</form>
</body>
</html>
