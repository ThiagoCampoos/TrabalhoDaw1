<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sessões do Tratamento</title>
</head>
<body>
<h1>Sessões</h1>

<table border="1" cellpadding="4" cellspacing="0">
    <thead>
    <tr>
        <th>Data</th>
        <th>Protocolo</th>
        <th>Valor</th>
        <th>É reavaliação?</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="sessao : ${sessoes}">
        <td th:text="${sessao.dataSessao}">2025-01-01</td>
        <td th:text="${sessao.protocolo}">Protocolo</td>
        <td th:text="${sessao.valor}">0.00</td>
        <td th:text="${sessao.ehReavaliacao}">false</td>
        <td>
            <form th:action="@{|/tratamentos/${tratamentoId}/sessoes/${sessao.id}/excluir|}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(sessoes)}">
        <td colspan="5">Nenhuma sessão cadastrada.</td>
    </tr>
    </tbody>
</table>

<h2>Nova sessão</h2>
<form th:action="@{|/tratamentos/${tratamentoId}/sessoes|}" method="post">
    <div>
        <label for="dataSessao">Data:</label>
        <input id="dataSessao" name="dataSessao" type="date" required>
    </div>
    <div>
        <label for="protocolo">Protocolo:</label>
        <input id="protocolo" name="protocolo" type="text">
    </div>
    <div>
        <label for="valor">Valor:</label>
        <input id="valor" name="valor" type="number" step="0.01" required>
    </div>
    <div>
        <label>
            <input type="checkbox" name="ehReavaliacao">
            É reavaliação
        </label>
    </div>
    <div>
        <button type="submit">Salvar</button>
        <a th:href="@{/clientes}">Voltar</a>
    </div>
</form>
</body>
</html>
